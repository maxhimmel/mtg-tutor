# What a set's own mechanics mean — CANONICAL machine-readable source.
#
# Compiled into src/model/mechanics.generated.ts by scripts/generate-principles.ts,
# so edit THIS file and re-run `pnpm --filter @mtg-tutor/core generate`.
#
# WHY THIS EXISTS
#
# A drafter opening an LTR pack is told "the Ring tempts you" and nothing else,
# because LTR shipped that rule on a separate card in the booster. Nothing in
# the app could say what it meant, and it was not an outlier: 1,521 of the 9,552
# cards in the pool carry a mechanic the hover panel had no entry for, better
# than two cards in a fourteen-card pack.
#
# WHY THE PROSE IS OURS
#
# The Comprehensive Rules answer every one of these and are not licensed for it.
# The Fan Content Policy carves verbatim republication of rules content out of
# what it permits, and the CR document grants nothing at all. So `rule` is a
# citation for a reader who wants the whole thing, and `short` is a sentence
# somebody wrote. `checkOriginal` in model/mechanicsSchema.ts fails the build if
# any definition drifts back into Wizards' wording.
#
# WHY IT IS FLAT AND NOT KEYED BY SET
#
# The match is against a card's own rules text, exactly as keywordsOf already
# works, so nothing at runtime needs to know which set it is looking at. Which
# sets carry what is an authoring question, and it lives in refresh-mechanics'
# report where it can fail loudly.
#
# WHAT DOES NOT BELONG HERE
#
# Anything in all 26 sets. Flying, trample and deathtouch are in
# model/keywords.ts and stay there: that list is the evergreen layer, its prose
# is terser than anything either source gives, and a mechanic wants ONE
# definition. The bar for this file is a mechanic on eight or more cards of a
# set that appears in six of our sets or fewer.

meta:
  title: "Set mechanics"
  note: "What a mechanic a set is built on actually does, for the hover panel and the coach."
  sources: "./set-mechanics-sources.md"

mechanics:
  # The five that were already in model/keywords.ts under its invitation to
  # "append a set's own mechanic here". Rewritten rather than moved: the prose
  # there was the printed reminder with the brackets taken off, and the licence
  # check caught Discover sharing twelve words with the rules the first time it
  # ran. Reminder text is card text and we are allowed to ship it -- but a corpus
  # half in Wizards' register and half in ours reads like two different apps.
  - name: Saddle
    kind: keyword
    rule: "702.171"
    short: >-
      Tap your other creatures until their power adds up to the saddle number and the Mount
      is saddled for the turn. Most Mounts only do their good thing while it is.

  - name: Discover
    kind: action
    rule: "701.57"
    short: >-
      Turn over cards until you hit a nonland one cheap enough, then cast it for free or take
      it into your hand. Everything else goes to the bottom.

  - name: Backup
    kind: keyword
    rule: "702.165"
    short: >-
      It enters and puts that many +1/+1 counters somewhere. On another creature, that
      creature also borrows the rest of this card's abilities for the turn. On itself, it just
      comes down bigger.

  - name: Bargain
    kind: keyword
    rule: "702.166"
    short: >-
      As you cast it you may sacrifice an artifact, an enchantment or a token, and the spell
      does more if you did.

  - name: Storm
    kind: keyword
    rule: "702.40"
    short: >-
      It copies itself once for every spell already cast this turn, and you pick new targets
      for each copy. Cast late in a busy turn it is many more than one spell.

# Terms the vocabulary finds that are not mechanics anybody is stuck on. Read by
# refresh-mechanics, never by the app.
#
# The inflections and the duplicate headings are NOT here -- `Saddled`, `Plotted`,
# `The Ring` next to `The Ring Tempts You` -- because those are set containment
# and the script settles them itself. What is left is judgement, and judgement
# gets a reason written next to it.
ignored:
  - name: Face Up
    why: >-
      How morph, disguise and cloak are worded, on 55 cards of ktk and mkm. The
      mechanic a drafter needs told about is Morph or Disguise; this is the
      sentence those are written in.
  - name: Starting Deck
    why: Companion's own wording. Companion is the entry; this is a phrase inside it.
  - name: Color Identity
    why: A deckbuilding rule the app already enforces, not something a card does.
  - name: Commander
    why: >-
      A format this app does not deal. It turns up because mh3 prints cards with
      one eye on it, and none of them mean anything in a draft.
  - name: Unlock
    why: How a Room is worded. Room is the entry.
  - name: Door
    why: The half of a Room you cast. Room is the entry.
  - name: Speed
    why: >-
      The counter Start Your Engines! gives you. Both of those are entries, and
      this is the noun they share.

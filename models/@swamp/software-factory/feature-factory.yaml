type: '@swamp/software-factory'
typeVersion: 2026.06.24.1
id: 6f58cef4-ca3f-40af-973a-e052361875d8
name: feature-factory
version: 1
tags: {}
methods: {}

# The lifecycle every feature in this repo walks:
#
#   triage -> research -> planning -+-> implementing -> review -> done
#                ^                   |        ^             |
#                |                   +-> plan-decision       |
#                +---------------- rework ------------------+
#
# One line forward and one edge back. The first run of this factory had three
# loops and two review stages, and what it produced was five plan cycles on one
# work item and no code. The reason is worth keeping written down: a plan is
# prose, and an adversarial reviewer told to refute prose always succeeds.
# There is no floor. So the plan is no longer reviewed -- it is built, and the
# reviewers argue with a branch instead. Every turn of the loop now costs a
# working attempt and produces facts the next round of research can start from.
#
# Three things here are enforcement, not paperwork:
#
#   The `research` stage gates everything. Nothing reaches planning without a
#   recorded research artifact, and that artifact's schema requires
#   `contradictions` -- so research that found only agreement has to say so out
#   loud rather than by omission.
#
#   `implementing` cannot advance on an assertion that the suite is green.
#   `evidence-validator` (@mgreten/test-evidence-validator) shells out to git
#   and refuses unless the worktree is clean, HEAD equals the recorded
#   `headSha`, and the branch matches -- and it rejects a result that claims
#   tests while no recorded command matches a real runner. `pnpm test` was red
#   for several commits of the first run and every review passed anyway,
#   because nothing in the machine ran anything.
#
#   The `change-summary` schema requires a branch and a base branch, and a cel
#   gate refuses `submit` when they match. Work committed straight onto the
#   base branch cannot advance.
#
# `review`'s only failure edge goes back to `research`, deliberately. The first
# run put a second edge beside it leading to `planning`, and the driver took
# the cheap-looking one every time -- rewriting the plan when five of nine
# findings said the ground truth was wrong. One edge, no choice, and a loop
# costs a fact-check rather than a rewrite.
#
# `plan-decision` is a human checkpoint, and it is NOT a review -- it dispatches
# nobody. The stage it replaces did dispatch, and that is what looped: an
# adversarial reviewer told to refute prose always succeeds, so the loop had no
# floor. This one either passes or a human says what to change, which is bounded
# by a human's patience rather than by a reviewer's imagination. Do not add
# `skills` to it.
#
# What routes into it is a recorded fact, not a judgement: research's
# `openQuestions`. `research-conventions.md` already defines that field as the
# things research could not settle, so an empty array means the ground is
# settled and the plan goes straight to a branch. Two inverse cel gates, exactly
# one satisfied, nobody chooses -- the same pattern the deleted express lane
# used, reading a fact worth reading this time. The express lane routed on five
# booleans the author graded themselves, under a convention that said to answer
# `true` when unsure, so it never once fired.
#
# The cost: an empty `openQuestions` now routes past a human, so it is a
# load-bearing claim rather than decoration. `research-critic` is told to attack
# it, and it does so at `review` -- late, but the blast radius is bounded, since
# the change still gets reviewed and a human still holds `ship-approval`.
#
# The reviews are LLM judgement today. The deterministic versions (axe over
# /dev, the vernacular avoid-list lint) become `workflow` stages beside them,
# which is a YAML edit and no change to the machine's shape.
globalArguments:
  stages:
    - id: triage
      initial: true
      description: >-
        Declare what the change touches, before anyone has an interest in the
        answer.
      maxCycles: 3
      work:
        mode: interactive
        constraints: agent-constraints/triage-conventions.md
      artifacts:
        - name: triage
          schema:
            type: object
            required:
              - summary
              - touchesGraphics
              - touchesStats
              - touchesUserFacingCopy
              - touchesUserFacingFlow
              - needsNewDependency
              - rationale
            properties:
              summary:
                type: string
                minLength: 1
              # These no longer route anything -- the express lane they used to
              # pick was deleted, because with "uncertain means true" in the
              # conventions it could not fire on anything worth a factory run.
              # They are handed to every reviewer instead, so a lane's
              # specialist knows what the author declared before it starts
              # looking. A false flag is a claim a reviewer can refute.
              touchesGraphics: { type: boolean }
              touchesStats: { type: boolean }
              touchesUserFacingCopy: { type: boolean }
              touchesUserFacingFlow: { type: boolean }
              needsNewDependency: { type: boolean }
              rationale:
                type: string
                minLength: 1
      transitions:
        - name: submit
          to: research
          gates:
            - type: artifact-exists
              config: { artifact: triage }

    - id: research
      description: >-
        Read before building. Collate sources, and go looking for the argument
        against.
      maxCycles: 3
      work:
        mode: interactive
        skills: [research]
        constraints: agent-constraints/research-conventions.md
      artifacts:
        - name: research
          schema:
            type: object
            required: [question, sources, findings, contradictions, openQuestions]
            properties:
              question:
                type: string
                minLength: 1
              sources:
                type: array
                minItems: 2
                items:
                  type: object
                  required: [url, claim]
                  properties:
                    url: { type: string, minLength: 1 }
                    claim: { type: string, minLength: 1 }
              findings:
                type: array
                minItems: 1
                items: { type: string }
              contradictions:
                type: array
                items:
                  type: object
                  required: [claim, counterClaim]
                  properties:
                    claim: { type: string, minLength: 1 }
                    counterClaim: { type: string, minLength: 1 }
                    resolution: { type: string }
              openQuestions:
                type: array
                items: { type: string }
      transitions:
        - name: submit
          to: planning
          gates:
            - type: artifact-exists
              config: { artifact: research }

    - id: planning
      description: >-
        Turn the research into a plan somebody could disagree with. Nobody
        reviews it -- the branch gets reviewed instead.
      maxCycles: 3
      work:
        mode: interactive
        constraints: agent-constraints/planning-conventions.md
      artifacts:
        - name: plan
          schema:
            type: object
            required: [summary, steps, testingStrategy, instrumentation]
            properties:
              summary:
                type: string
                minLength: 1
              steps:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [description]
                  properties:
                    description: { type: string, minLength: 1 }
                    files: { type: array, items: { type: string } }
              testingStrategy:
                type: string
                minLength: 1
              # CLAUDE.md: every change a person can feel gets a paired metric.
              # "nothing to instrument, and here is why" is a valid answer; a
              # missing answer is not.
              instrumentation:
                type: string
                minLength: 1
              rejectedOptions:
                type: array
                items:
                  type: object
                  required: [option, why]
                  properties:
                    option: { type: string, minLength: 1 }
                    why: { type: string, minLength: 1 }
      transitions:
        - name: submit
          to: implementing
          gates:
            - type: artifact-exists
              config: { artifact: plan }
            - type: cel
              config:
                expr: size(artifacts.research.openQuestions) == 0
                message: >-
                  Research left an open question, so somebody has to decide
                  before this gets built. Take plan-decision.
        - name: decide
          to: plan-decision
          gates:
            - type: artifact-exists
              config: { artifact: plan }
            - type: cel
              config:
                expr: size(artifacts.research.openQuestions) > 0
                message: >-
                  Research settled everything it raised. This goes straight to a
                  branch -- there is nothing for a human to decide.

    - id: plan-decision
      description: >-
        Research could not settle something. Put the plan and the open questions
        in front of a human and let them decide, before a line of it is built.
      maxCycles: 3
      transitions:
        - name: approve
          to: implementing
          gates:
            - type: human-approval
              config: { id: plan-approval }
        # Where a rejection goes. `manual: true` so it never competes with
        # `approve` for the propulsion rule -- an ungated edge beside a
        # human-approval gate would leave the driver asking at every pass.
        - name: revise
          to: planning
          manual: true

    - id: implementing
      description: >-
        Build it, on a branch, in commits somebody could review one at a time --
        and prove the suite ran on the commit you are claiming.
      maxCycles: 5
      work:
        mode: interactive
        constraints: agent-constraints/git-conventions.md
      artifacts:
        - name: change-summary
          schema:
            type: object
            required: [summary, branch, baseBranch, commits, headSha]
            properties:
              summary:
                type: string
                minLength: 1
              branch:
                type: string
                minLength: 1
              baseBranch:
                type: string
                minLength: 1
              # One, deliberately: a genuine one-commit fix should not be
              # blocked from being recorded. The discipline that stayed is the
              # branch -- see the cel gate on `submit`.
              commits:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [sha, subject]
                  properties:
                    sha: { type: string, minLength: 7 }
                    subject: { type: string, minLength: 1 }
              # Full 40-hex, because the verify gate pins against it and a
              # short sha will not pin.
              headSha:
                type: string
                pattern: '^[0-9a-f]{40}$'
              files:
                type: array
                items: { type: string }
      evidence:
        # The verdict from `evidence-validator validate`. Recorded, not
        # asserted: the model runs `git status --porcelain`, `git rev-parse
        # HEAD` and `git rev-parse --abbrev-ref HEAD` in the worktree, and
        # rejects a result that reports failure, whose counts do not add up,
        # that contains a non-zero-exit command, or that claims tests while no
        # recorded command matches a real test runner.
        - name: verify-run
          schema:
            type: object
            required: [label, valid, expectedHeadSha, expectedBranch, summary]
            properties:
              label: { type: string, minLength: 1 }
              valid: { type: boolean }
              errors: { type: array, items: { type: string } }
              expectedHeadSha: { type: string, pattern: '^[0-9a-f]{40}$' }
              expectedBranch: { type: string, minLength: 1 }
              testsRun: { type: integer }
              testsPassed: { type: integer }
              testsFailed: { type: integer }
              summary: { type: string, minLength: 1 }
              validatedAt: { type: string }
      transitions:
        - name: submit
          to: review
          gates:
            - type: artifact-exists
              config: { artifact: change-summary }
            - type: cel
              config:
                expr: artifacts.change_summary.branch != artifacts.change_summary.baseBranch
                message: >-
                  The work was committed onto its own base branch. Move it to a
                  feature branch and re-record the change summary.
            - type: evidence-recorded
              config:
                name: verify-run
                requireField: { valid: true }
            # The verdict knows what git said; it does not know what was
            # recorded. This is the join, and without it a green run from an
            # earlier commit would satisfy the gate.
            - type: cel
              config:
                expr: >-
                  evidence.verify_run.expectedHeadSha == artifacts.change_summary.headSha &&
                  evidence.verify_run.expectedBranch == artifacts.change_summary.branch
                message: >-
                  The verified run is pinned to a different commit or branch
                  than the change summary records. Re-run the suite and
                  re-validate against the current head.

    - id: review
      description: >-
        Five adversarial reviews of the built change, in parallel -- the three
        recurring complaints in this repo, plus architecture, plus whether the
        thing that got built is warranted by what was actually found.
      maxCycles: 3
      work:
        mode: dispatch
        skills:
          - architecture-review
          - research-critic
          - graphics-review
          - voice-review
          - stats-review
        systemPrompt: |
          You are an adversarial reviewer with one specialty, named by the
          skill you were given. Review this change:

          ${{ data.latest(self.name, "artifact-change-summary").payload.summary }}

          on branch ${{ data.latest(self.name, "artifact-change-summary").payload.branch }}
          at ${{ data.latest(self.name, "artifact-change-summary").payload.headSha }}

          Its triage, including the five flags the author declared. A false flag
          in your lane is a claim, not a bar -- if it is wrong, that is a
          finding:
          ${{ data.latest(self.name, "artifact-triage") }}

          The research it rests on:
          ${{ data.latest(self.name, "artifact-research") }}

          The plan it claims to implement:
          ${{ data.latest(self.name, "artifact-plan") }}

          Read the branch. Every claim you make names a file and a line you
          opened -- a citation carried from somewhere else is not a finding.

          Stay in your lane; another reviewer has the others. Severities are
          critical/high/medium/low, and ONLY critical and high block the ship --
          so do not inflate a medium to force a change, and do not pad the list
          to look thorough. A clean verdict is a real verdict: if your specialty
          has nothing to say about this change, record no findings and say so.

          Keep each finding under 700 characters. Longer ones get truncated in
          transit, which is how a real finding arrives unreadable.
      artifacts:
        - name: review
          kind: findings
          reviews: change-summary
      transitions:
        - name: ship
          to: done
          gates:
            - type: artifact-fresh
              config: { artifact: review, recordedThisCycle: true }
            - type: findings-clear
              config: { artifact: review, blocking: [critical, high] }
            - type: human-approval
              config: { id: ship-approval }
        # The only way back, and it goes to research rather than to planning.
        # Findings on real code are facts about the ground; the next attempt
        # should start by checking the ground.
        - name: rework
          to: research

    - id: done
      terminal: true

    - id: aborted
      terminal: true

  globalTransitions:
    - name: abort
      to: aborted
      gates:
        - type: human-approval
          config: { id: abort-confirmation }

# Method-scoped so the stored summaries are real history rather than a stack of
# empty placeholders written after every record_artifact.
reports:
  require:
    - name: "@swamp/software-factory/work-item-summary"
      methods: [summary]
